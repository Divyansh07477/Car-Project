<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - RideWave</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      font-family:
        'Segoe UI',
        Roboto,
        Arial,
        sans-serif;
    }


    /* =========================
       BODY
    ========================= */

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      position: relative;

      overflow: hidden;
    }


    /* =========================
       BLURRED HOME BACKGROUND
    ========================= */

    .background {
      position: fixed;

      inset: -25px;

      background:
        linear-gradient(
          rgba(10, 15, 25, 0.58),
          rgba(10, 15, 25, 0.58)
        ),
        url("images/your-home-car-image.jpg");

      background-size: cover;

      background-position: center;

      filter: blur(7px);

      transform: scale(1.08);

      z-index: -2;
    }


    /* =========================
       ORANGE GLOW
    ========================= */

    body::before {
      content: "";

      position: fixed;

      width: 350px;
      height: 350px;

      background:
        rgba(229, 63, 40, 0.18);

      border-radius: 50%;

      filter: blur(100px);

      top: -150px;
      left: -100px;

      z-index: -1;
    }


    /* =========================
       AUTH CARD
    ========================= */

    .auth-card {
      width: 100%;

      max-width: 430px;

      padding: 34px;

      background:
        rgba(255, 255, 255, 0.97);

      border:
        1px solid
        rgba(255, 255, 255, 0.7);

      border-radius: 24px;

      box-shadow:
        0 30px 80px
        rgba(0, 0, 0, 0.42);

      animation:
        cardIn 0.6s ease;

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }


    .auth-card:hover {
      transform:
        translateY(-3px);

      box-shadow:
        0 35px 90px
        rgba(0, 0, 0, 0.48);
    }


    /* =========================
       CARD ANIMATION
    ========================= */

    @keyframes cardIn {

      from {
        opacity: 0;

        transform:
          translateY(25px)
          scale(0.97);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    /* =========================
       LOGO
    ========================= */

    .logo-link {
      display: flex;

      justify-content: center;

      align-items: center;

      margin-bottom: 18px;

      text-decoration: none;
    }


    .logo-link img {
      width: 150px;

      height: auto;

      display: block;

      transition:
        transform 0.3s ease,
        filter 0.3s ease;
    }


    .logo-link:hover img {
      transform:
        scale(1.06);

      filter:
        drop-shadow(
          0 6px 12px
          rgba(229, 63, 40, 0.28)
        );
    }


    /* =========================
       HEADING
    ========================= */

    .brand {
      text-align: center;

      margin-bottom: 27px;
    }


    .brand h1 {
      font-size: 30px;

      font-weight: 750;

      color: #172554;

      letter-spacing: -0.7px;
    }


    .brand h1 span {
      color: #e53f28;
    }


    .brand p {
      margin-top: 7px;

      font-size: 14px;

      color: #718096;
    }


    /* =========================
       INPUT GROUP
    ========================= */

    .input-group {
      margin-bottom: 19px;
    }


    .input-group label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;

      font-weight: 600;

      color: #333;
    }


    /* =========================
       INPUT WRAPPER
    ========================= */

    .input-wrapper {
      position: relative;
    }


    .input-wrapper > i {
      position: absolute;

      left: 15px;

      top: 50%;

      transform:
        translateY(-50%);

      color: #999;

      font-size: 15px;

      pointer-events: none;

      transition:
        color 0.25s ease;
    }


    .input-wrapper input {
      width: 100%;

      height: 48px;

      padding:
        0 45px;

      border:
        1px solid #dedede;

      border-radius: 11px;

      outline: none;

      background: #fff;

      color: #222;

      font-size: 14px;

      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;
    }


    .input-wrapper input::placeholder {
      color: #aaa;
    }


    /* INPUT HOVER */

    .input-wrapper input:hover {
      border-color: #c4c4c4;
    }


    /* INPUT FOCUS */

    .input-wrapper input:focus {
      border-color: #e53f28;

      box-shadow:
        0 0 0 4px
        rgba(229, 63, 40, 0.10);

      transform:
        translateY(-1px);
    }


    .input-wrapper:focus-within > i {
      color: #e53f28;
    }


    /* =========================
       PASSWORD EYE
    ========================= */

    .password-eye {
      position: absolute;

      right: 13px;

      top: 50%;

      transform:
        translateY(-50%);

      border: none;

      background: transparent;

      color: #888;

      cursor: pointer;

      font-size: 15px;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }


    .password-eye:hover {
      color: #e53f28;

      transform:
        translateY(-50%)
        scale(1.1);
    }


    /* =========================
       LOGIN BUTTON
    ========================= */

    .submit-btn {
      width: 100%;

      height: 48px;

      margin-top: 5px;

      border: none;

      border-radius: 11px;

      background: #e53f28;

      color: #fff;

      font-size: 15px;

      font-weight: 650;

      cursor: pointer;

      box-shadow:
        0 8px 18px
        rgba(229, 63, 40, 0.22);

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }


    .submit-btn:hover {
      background: #cf351f;

      transform:
        translateY(-2px);

      box-shadow:
        0 12px 25px
        rgba(229, 63, 40, 0.30);
    }


    .submit-btn:active {
      transform:
        translateY(0);
    }


    .submit-btn:disabled {
      opacity: 0.7;

      cursor: not-allowed;

      transform: none;

      box-shadow: none;
    }


    /* =========================
       SIGNUP TEXT
    ========================= */

    .toggle-box {
      margin-top: 21px;

      text-align: center;

      font-size: 13px;

      color: #777;
    }


    .toggle-box a {
      color: #e53f28;

      font-weight: 700;

      text-decoration: none;

      margin-left: 4px;

      transition:
        color 0.2s ease;
    }


    .toggle-box a:hover {
      color: #b92d1b;

      text-decoration: underline;
    }


    /* =========================
       DIVIDER
    ========================= */

    .divider {
      display: flex;

      align-items: center;

      gap: 12px;

      margin: 22px 0;

      color: #aaa;

      font-size: 10px;

      font-weight: 600;
    }


    .divider::before,
    .divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background: #e6e6e6;
    }


    /* =========================
       SOCIAL BUTTONS
    ========================= */

    .social-buttons {
      display: flex;

      justify-content: center;

      gap: 13px;
    }


    .social-btn {
      width: 43px;

      height: 43px;

      border-radius: 50%;

      border:
        1px solid #ddd;

      background: #fff;

      color: #444;

      cursor: pointer;

      font-size: 15px;

      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        color 0.25s ease,
        box-shadow 0.25s ease;
    }


    .social-btn:hover {
      border-color: #e53f28;

      color: #e53f28;

      transform:
        translateY(-4px);

      box-shadow:
        0 8px 18px
        rgba(229, 63, 40, 0.14);
    }


    /* =========================
       BACK TO HOME
    ========================= */

    .home-link {
      display: block;

      margin-top: 21px;

      text-align: center;

      color: #777;

      font-size: 12px;

      text-decoration: none;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }


    .home-link:hover {
      color: #e53f28;

      transform:
        translateX(-2px);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      body {
        padding: 15px;
      }


      .auth-card {
        padding: 28px 22px;

        border-radius: 20px;
      }


      .logo-link img {
        width: 135px;
      }


      .brand h1 {
        font-size: 25px;
      }


      .brand p {
        font-size: 12px;
      }

    }



  </style>





















</head>


<body>

  <!-- Blurred Background -->
  <div class="background"></div>


  <!-- =========================
       LOGIN CARD
  ========================= -->

  <div class="auth-card">

    <!-- Heading -->
    <div class="brand">

      <h1>
        Welcome <span>Back</span>
      </h1>

      <p>
        Sign in to manage your car bookings
      </p>

    </div>


    <!-- LOGIN FORM -->
    <form id="loginForm">

      <!-- Email -->
      <div class="input-group">

        <label for="email">
          Email Address
        </label>

        <div class="input-wrapper">

          <i class="fa-regular fa-envelope"></i>

          <input
            type="email"
            id="email"
            placeholder="name@example.com"
            required
            autocomplete="email"
          >

        </div>

      </div>


      <!-- Password -->
      <div class="input-group">

        <label for="password">
          Password
        </label>

        <div class="input-wrapper">

          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >

          <button
            type="button"
            class="password-eye"
            id="eyeBtn"
            onclick="togglePassword()"
          >
            <i class="fa-regular fa-eye"></i>
          </button>

        </div>

      </div>


      <!-- Login Button -->
      <button
        type="submit"
        class="submit-btn"
        id="loginBtn"
      >
        Log In
      </button>

    </form>


    <!-- SIGNUP -->
    <div class="toggle-box">

      Don't have an account?

      <a href="signup.html">
        Sign Up
      </a>

    </div>


    <!-- DIVIDER -->
    <div class="divider">
      <span>OR</span>
    </div>


    <!-- SOCIAL BUTTONS -->
    <div class="social-buttons">

      <button
        type="button"
        class="social-btn"
        title="Google"
      >
        <i class="fa-brands fa-google"></i>
      </button>

      <button
        type="button"
        class="social-btn"
        title="Facebook"
      >
        <i class="fa-brands fa-facebook-f"></i>
      </button>

      <button
        type="button"
        class="social-btn"
        title="X"
      >
        <i class="fa-brands fa-x-twitter"></i>
      </button>

    </div>


    <!-- HOME -->
    <a
      href="index.html"
      class="home-link"
    >
      ← Back to Home
    </a>

  </div>


  <!-- JAVASCRIPT -->
  <script>

    const supabaseUrl =
      'https://nqisunhjguxqdnlyckak.supabase.co';

    const supabaseAnonKey =
       'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoibnFpc3VuaGpndXhxZG5seWNrYWsiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4ODI2Nzc2MiwiZXhwIjoyMTAzODQzNzYyfQ.IKfBiMjMwwa6qMwKIb8BsMCKIwDtAh-dOeScRCkvXI0';

    const _supabase =
      supabase.createClient(
        supabaseUrl,
        supabaseAnonKey
      );


    function togglePassword() {

      const password =
        document.getElementById('password');

      const eyeBtn =
        document.getElementById('eyeBtn');

      if (password.type === 'password') {

        password.type = 'text';

        eyeBtn.innerHTML =
          '<i class="fa-regular fa-eye-slash"></i>';

      } else {

        password.type = 'password';

        eyeBtn.innerHTML =
          '<i class="fa-regular fa-eye"></i>';

      }

    }


    document
      .getElementById('loginForm')
      .addEventListener(
        'submit',
        async function(e) {

          e.preventDefault();

          const email =
            document
              .getElementById('email')
              .value
              .trim();

          const password =
            document
              .getElementById('password')
              .value;

          const loginBtn =
            document.getElementById('loginBtn');

          loginBtn.disabled = true;
          loginBtn.innerText = 'Logging In...';

          try {

            const { data, error } =
              await _supabase.auth.signInWithPassword({

                email: email,
                password: password

              });

            if (error) {
              throw error;
            }

            alert('Login Successful!');

            window.location.href =
              'index.html';

          } catch (err) {

            alert(
              err.message ||
              'Login failed!'
            );

          } finally {

            loginBtn.disabled = false;
            loginBtn.innerText = 'Log In';

          }

        }
      );

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <title>Create Account - RideWave</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      background:
        linear-gradient(
          rgba(7, 19, 68, 0.78),
          rgba(7, 19, 68, 0.78)
        ),
        linear-gradient(135deg, #f5f5f5, #dcdcdc);

      position: relative;
      overflow: hidden;
    }

    /* Background blur effect */
    body::before {
      content: "";
      position: absolute;
      inset: -40px;

      background:
        radial-gradient(circle at 80% 40%, #e53f28 0%, transparent 28%),
        radial-gradient(circle at 20% 70%, #071344 0%, transparent 35%);

      filter: blur(45px);
      opacity: 0.75;
      z-index: 0;
    }

    /* Signup Card */
    .auth-card {
      width: 100%;
      max-width: 430px;

      background: rgba(255, 255, 255, 0.96);

      border-radius: 18px;
      padding: 34px 32px 28px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.30);

      position: relative;
      z-index: 2;

      animation: cardShow 0.5s ease;
    }

    @keyframes cardShow {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Close button */
    .close-btn {
      position: absolute;
      top: 14px;
      right: 17px;

      width: 30px;
      height: 30px;

      border: none;
      background: transparent;

      font-size: 23px;
      color: #777;

      cursor: pointer;

      transition: 0.2s;
    }

    .close-btn:hover {
      color: #e53f28;
      transform: rotate(90deg);
    }

    /* Brand */
    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;

      margin: 0 auto 10px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #fff1ee;
      border-radius: 50%;

      font-size: 25px;
    }

    .brand h1 {
      font-size: 25px;
      color: #071344;
      font-weight: 700;
    }

    .brand h1 span {
      color: #e53f28;
    }

    .brand p {
      margin-top: 6px;

      font-size: 13px;
      color: #7b8190;
    }

    /* Input */
    .input-group {
      margin-bottom: 17px;
    }

    .input-group label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 600;

      color: #303746;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;

      left: 13px;
      top: 50%;

      transform: translateY(-50%);

      color: #9ca3af;
      font-size: 15px;
    }

    .input-group input {
      width: 100%;

      height: 48px;

      padding: 0 14px 0 40px;

      border: 1px solid #dedfe3;
      border-radius: 9px;

      outline: none;

      font-size: 14px;
      color: #222;

      background: #fff;

      transition: 0.2s;
    }

    .input-group input:focus {
      border-color: #e53f28;

      box-shadow:
        0 0 0 3px rgba(229, 63, 40, 0.10);
    }

    .input-group input::placeholder {
      color: #a5a8ae;
    }

    /* Password eye */
    .password-eye {
      position: absolute;

      right: 13px;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: transparent;

      color: #8b8f98;

      cursor: pointer;
      font-size: 15px;
    }

    /* Signup Button */
    .submit-btn {
      width: 100%;
      height: 49px;

      margin-top: 5px;

      border: none;
      border-radius: 9px;

      background: #e53f28;
      color: white;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.25s;
    }

    .submit-btn:hover {
      background: #c93220;

      transform: translateY(-1px);

      box-shadow:
        0 8px 20px rgba(229, 63, 40, 0.25);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;

      gap: 12px;

      margin: 22px 0 18px;

      color: #a2a5ab;

      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";

      height: 1px;

      flex: 1;

      background: #e3e3e3;
    }

    /* Social */
    .social-buttons {
      display: flex;
      justify-content: center;
      gap: 13px;
    }

    .social-btn {
      width: 42px;
      height: 42px;

      border: 1px solid #e2e2e2;
      border-radius: 50%;

      background: white;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #333;

      font-size: 15px;

      cursor: pointer;

      transition: 0.2s;
    }

    .social-btn:hover {
      border-color: #e53f28;
      color: #e53f28;

      transform: translateY(-2px);
    }

    /* Login */
    .login-text {
      text-align: center;

      margin-top: 22px;

      font-size: 13px;

      color: #777;
    }

    .login-text a {
      color: #e53f28;

      font-weight: 600;

      text-decoration: none;

      margin-left: 4px;
    }

    .login-text a:hover {
      text-decoration: underline;
    }

    /* Home */
    .home-link {
      display: block;

      text-align: center;

      margin-top: 14px;

      color: #999;

      font-size: 12px;

      text-decoration: none;
    }

    .home-link:hover {
      color: #e53f28;
    }

    /* Mobile */
    @media (max-width: 480px) {

      body {
        padding: 15px;
      }

      .auth-card {
        padding: 30px 22px 25px;
      }

      .brand h1 {
        font-size: 23px;
      }
    }

.logo-link {
  display: block;
  text-align: center;
  margin-bottom: 20px;
}

.logo-link img {
  width: 150px;
  height: auto;
  display: inline-block;
}


    
  </style>













</head>


<body>

  <div class="auth-card">

    <!-- Close -->
   

    <!-- Brand -->
    <div class="brand">



      <h1>Create <span>Account</span></h1>

      <p>
        Register to start renting cars in minutes
      </p>

    </div>


    <!-- Signup Form -->
    <form id="signupForm">


        <div class="input-group">

  <label>Full Name</label>

  <div class="input-wrapper">

    <i class="fa-regular fa-user"></i>

    <input
      type="text"
      id="name"
      placeholder="Enter your full name"
      required
      autocomplete="name"
    >

  </div>

</div>
      <!-- Email -->
      <div class="input-group">

        <label>Email Address</label>

        <div class="input-wrapper">

        <i class="fa-regular fa-envelope"></i>

          <input
            type="email"
            id="email"
            placeholder="name@example.com"
            required
            autocomplete="email"
          >

        </div>

      </div>


      <!-- Password -->
      <div class="input-group">

        <label>Password</label>

        <div class="input-wrapper">

         <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            id="password"
            placeholder="Create a password"
            required
            minlength="6"
            autocomplete="new-password"
          >

          <button
            type="button"
            class="password-eye"
            onclick="togglePassword()"
            id="eyeBtn"
          >
          <i class="fa-regular fa-eye"></i>
          </button>

        </div>

      </div>


      <!-- Signup -->
      <button
        type="submit"
        class="submit-btn"
        id="signupBtn"
      >
        Create Account
      </button>

    </form>


    <!-- Divider -->
    <div class="divider">
      <span>or continue with</span>
    </div>


    <!-- Social -->
    <div class="social-buttons">

    <button class="social-btn" type="button">
        <i class="fa-brands fa-google"></i>
    </button>

    <button class="social-btn" type="button">
        <i class="fa-brands fa-facebook-f"></i>
    </button>

    <button class="social-btn" type="button">
        <i class="fa-brands fa-x-twitter"></i>
    </button>

</div>


    <!-- Login -->
    <div class="login-text">

      Already have an account?

      <a href="login.html">
        Log In
      </a>

    </div>


    <!-- Home -->
    <a href="index.html" class="home-link">
      ← Back to Home
    </a>

  </div>


  <script>

    // =========================
    // SUPABASE
    // =========================

    const supabaseUrl =
      'https://nqisunhjguxqdnlyckak.supabase.co';

    const supabaseAnonKey =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoibnFpc3VuaGpndXhxZG5seWNrYWsiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4ODI2Nzc2MiwiZXhwIjoyMTAzODQzNzYyfQ.IKfBiMjMwwa6qMwKIb8BsMCKIwDtAh-dOeScRCkvXI0';

    const _supabase =
      supabase.createClient(
        supabaseUrl,
        supabaseAnonKey
      );


    // =========================
    // PASSWORD SHOW / HIDE
    // =========================
function togglePassword() {

  const password =
    document.getElementById('password');

  const eye =
    document.getElementById('eyeBtn');

  if (password.type === 'password') {

    password.type = 'text';

    eye.innerHTML =
      '<i class="fa-regular fa-eye-slash"></i>';

  } else {

    password.type = 'password';

    eye.innerHTML =
      '<i class="fa-regular fa-eye"></i>';

  }

}

    // =========================
    // CLOSE BUTTON
    // =========================

    function goHome() {

      window.location.href = 'index.html';

    }


    // =========================
    // SIGNUP
    // =========================

    document
      .getElementById('signupForm')
      .addEventListener('submit', async function(e) {

        e.preventDefault();

        const email =
          document
            .getElementById('email')
            .value
            .trim();

        const password =
          document
            .getElementById('password')
            .value;

        const signupBtn =
          document.getElementById('signupBtn');


        signupBtn.disabled = true;

        signupBtn.innerText =
          'Creating Account...';


        try {

          const { data, error } =
            await _supabase.auth.signUp({

              email: email,

              password: password

            });


          if (error) {

            throw error;

          }


          alert(
            'Account created successfully! Please check your email to verify your account.'
          );


          // Signup ke baad direct Login
          window.location.href =
            'login.html';


        } catch (err) {

          alert(
            err.message ||
            'Signup failed!'
          );

        } finally {

          signupBtn.disabled = false;

          signupBtn.innerText =
            'Create Account';

        }

      });

  </script>

</body>
</html>
